<!doctype html>
<!--
Interactive Diagram Builder Template

Use this file as the starting point for self-contained explanatory diagrams.

Keep:
- one-file HTML structure
- CSS + JS inline
- sidebar with controls/detail panel
- SVG canvas
- click/search/step/reset behavior

Replace:
- document title
- diagramData
- group colors/legend
- explanatory copy
- positions, nodes, edges, and step sequence

No build step required. Opens directly in a browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Diagram</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --paper: #fffdf8;
      --ink: #171717;
      --muted: #667085;
      --border: #ded6c8;
      --accent: #d97757;
      --blue: #6a9bcc;
      --green: #788c5d;
      --purple: #7c6db0;
      --red: #b85c5c;
      --gray: #8c8a82;
      --shadow: 0 18px 48px rgba(20, 20, 19, 0.12);
      --radius: 18px;
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #fff8ed 0, transparent 34rem), var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(310px, 380px) 1fr;
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    aside {
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      overflow: auto;
    }

    main {
      min-width: 0;
      background: rgba(255, 253, 248, 0.74);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin: 0 0 8px;
      font-family: var(--font-serif);
      font-size: 1.75rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .section {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 16px;
    }

    .section h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 10px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: #fff7f1;
    }

    button.primary {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    button.primary:hover {
      background: #c86641;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      margin-bottom: 10px;
    }

    .legend {
      display: grid;
      gap: 7px;
      font-size: 0.92rem;
    }

    .legend-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.16);
      flex: 0 0 auto;
    }

    .details {
      background: #fbf8f1;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      min-height: 150px;
    }

    .details h3 {
      margin: 0 0 7px;
      font-size: 1.05rem;
    }

    .details p {
      margin: 0 0 10px;
      color: #39414a;
      line-height: 1.48;
    }

    .details code {
      font-family: var(--font-mono);
      background: #eee7db;
      padding: 0.12rem 0.3rem;
      border-radius: 5px;
      font-size: 0.88em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .stage-list {
      display: grid;
      gap: 6px;
      max-height: 220px;
      overflow: auto;
      padding-right: 4px;
    }

    .stage {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .stage.active {
      border-color: var(--accent);
      background: #fff3ec;
      font-weight: 700;
    }

    .canvas-toolbar {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      z-index: 4;
    }

    .canvas-toolbar button {
      padding: 7px 9px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
    }

    #diagram {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 720px;
      cursor: grab;
      user-select: none;
    }

    #diagram.dragging {
      cursor: grabbing;
    }

    .edge {
      stroke: #8b8174;
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrow);
      opacity: 0.8;
    }

    .edge.dashed {
      stroke-dasharray: 7 7;
    }

    .edge.primary {
      stroke-width: 3.4;
      stroke: var(--accent);
      opacity: 0.95;
    }

    .edge.dimmed, .node.dimmed {
      opacity: 0.18;
    }

    .edge.highlight {
      stroke: var(--accent);
      stroke-width: 4;
      opacity: 1;
    }

    .edge-label {
      font-size: 12px;
      fill: #4b5563;
      paint-order: stroke;
      stroke: rgba(255, 253, 248, 0.92);
      stroke-width: 5px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .node rect {
      rx: 16;
      ry: 16;
      fill: white;
      stroke-width: 2.5;
      filter: drop-shadow(0 8px 14px rgba(20, 20, 19, 0.12));
      transition: filter 150ms ease;
    }

    .node:hover rect, .node.selected rect {
      filter: drop-shadow(0 12px 22px rgba(217, 119, 87, 0.28));
      stroke-width: 4;
    }

    .node text.label {
      font-size: 15px;
      font-weight: 750;
      fill: var(--ink);
      pointer-events: none;
    }

    .node text.kind {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: var(--muted);
      pointer-events: none;
    }

    .badge {
      fill: var(--ink);
    }

    .badge-text {
      fill: white;
      font-size: 11px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    .group-title {
      fill: #7a7167;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .group-box {
      fill: rgba(255,255,255,0.38);
      stroke: #d6ccbd;
      stroke-width: 1.4;
      stroke-dasharray: 8 8;
      rx: 20;
      ry: 20;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: #141413;
      color: #fffdf8;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      max-width: 280px;
      opacity: 0;
      transform: translate(-50%, -110%);
      transition: opacity 100ms ease;
      z-index: 6;
    }

    .tooltip.visible { opacity: 0.96; }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      #diagram { height: 76vh; min-height: 560px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1 id="title">Interactive Diagram</h1>
      <p class="subtitle" id="subtitle">Click nodes to inspect details. Use step controls to follow the primary flow.</p>

      <div class="section">
        <h2>Find</h2>
        <input id="search" type="search" placeholder="Search nodes..." />
        <div class="controls">
          <button class="primary" id="prevStep">Previous</button>
          <button class="primary" id="nextStep">Next</button>
          <button id="fitView">Fit View</button>
          <button id="reset">Reset</button>
        </div>
      </div>

      <div class="section">
        <h2>Primary Flow</h2>
        <div class="stage-list" id="stageList"></div>
      </div>

      <div class="section">
        <h2>Details</h2>
        <div class="details" id="details">
          <h3>Select a node</h3>
          <p>Click any diagram node to see what it means, what it connects to, and why it matters.</p>
        </div>
      </div>

      <div class="section">
        <h2>Legend</h2>
        <div class="legend" id="legend"></div>
      </div>
    </aside>

    <main>
      <div class="canvas-toolbar">
        <button id="zoomOut">−</button>
        <button id="zoomIn">+</button>
      </div>
      <svg id="diagram" viewBox="0 0 1200 760" role="img" aria-labelledby="title subtitle">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8174"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="groups"></g>
          <g id="edges"></g>
          <g id="edgeLabels"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div class="tooltip" id="tooltip"></div>
    </main>
  </div>

  <script>
    // Replace this sample data with the user's actual system, flow, architecture, or concept map.
    const diagramData = {
      title: "Example: Skill Invocation Flow",
      subtitle: "A small sample showing how a slash command becomes an interactive result.",
      groups: {
        input: { label: "Input", color: "#d97757" },
        routing: { label: "Routing", color: "#7c6db0" },
        processing: { label: "Processing", color: "#6a9bcc" },
        output: { label: "Output", color: "#788c5d" }
      },
      groupBoxes: [
        { id: "g1", label: "User + Command", x: 40, y: 80, w: 250, h: 560 },
        { id: "g2", label: "Pi Harness", x: 330, y: 80, w: 500, h: 560 },
        { id: "g3", label: "Deliverables", x: 870, y: 80, w: 280, h: 560 }
      ],
      nodes: [
        { id: "user", label: "User Request", kind: "input", group: "input", step: 1, x: 90, y: 260, w: 150, h: 74, detail: "The user asks for an interactive diagram or visual explanation." },
        { id: "skill", label: "Diagram Skill", kind: "skill", group: "routing", step: 2, x: 390, y: 180, w: 160, h: 74, detail: "The Pi agent loads this skill and follows its diagram-building workflow." },
        { id: "model", label: "Diagram Model", kind: "structure", group: "processing", step: 3, x: 620, y: 180, w: 160, h: 74, detail: "The system is represented as nodes, edges, groups, and explanatory details before drawing begins." },
        { id: "html", label: "HTML Artifact", kind: "file", group: "output", step: 4, x: 930, y: 180, w: 165, h: 74, detail: "A single self-contained HTML file is created so the user can open it in a browser." },
        { id: "interactions", label: "Interactions", kind: "behavior", group: "processing", step: 5, x: 505, y: 410, w: 170, h: 74, detail: "Click, search, step-through, and reset controls help the viewer learn by exploring." },
        { id: "explain", label: "Explanation", kind: "summary", group: "output", step: 6, x: 930, y: 410, w: 165, h: 74, detail: "The final response explains what the diagram shows and how to use it." }
      ],
      edges: [
        { from: "user", to: "skill", label: "invokes", type: "primary" },
        { from: "skill", to: "model", label: "structures", type: "primary" },
        { from: "model", to: "html", label: "renders", type: "primary" },
        { from: "model", to: "interactions", label: "drives", type: "secondary" },
        { from: "interactions", to: "html", label: "enhance", type: "secondary" },
        { from: "html", to: "explain", label: "summarized by", type: "primary" }
      ],
      steps: ["user", "skill", "model", "html", "interactions", "explain"]
    };

    const svg = document.getElementById("diagram");
    const viewport = document.getElementById("viewport");
    const nodesLayer = document.getElementById("nodes");
    const edgesLayer = document.getElementById("edges");
    const labelsLayer = document.getElementById("edgeLabels");
    const groupsLayer = document.getElementById("groups");
    const details = document.getElementById("details");
    const tooltip = document.getElementById("tooltip");
    const stageList = document.getElementById("stageList");

    let selectedNodeId = null;
    let currentStep = -1;
    let transform = { x: 0, y: 0, scale: 1 };
    let dragging = false;
    let dragStart = { x: 0, y: 0 };

    const nodeById = Object.fromEntries(diagramData.nodes.map(n => [n.id, n]));

    function setTransform() {
      viewport.setAttribute("transform", `translate(${transform.x} ${transform.y}) scale(${transform.scale})`);
    }

    function groupColor(group) {
      return diagramData.groups[group]?.color || "#8c8a82";
    }

    function center(node) {
      return { x: node.x + node.w / 2, y: node.y + node.h / 2 };
    }

    function edgePath(a, b) {
      const ac = center(a);
      const bc = center(b);
      const dx = bc.x - ac.x;
      const dy = bc.y - ac.y;
      const sx = ac.x + Math.sign(dx || 1) * a.w / 2;
      const sy = ac.y + Math.max(-a.h / 3, Math.min(a.h / 3, dy * 0.18));
      const tx = bc.x - Math.sign(dx || 1) * b.w / 2;
      const ty = bc.y - Math.max(-b.h / 3, Math.min(b.h / 3, dy * 0.18));
      const c1x = sx + dx * 0.36;
      const c1y = sy;
      const c2x = tx - dx * 0.36;
      const c2y = ty;
      return `M ${sx} ${sy} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${tx} ${ty}`;
    }

    function render() {
      document.getElementById("title").textContent = diagramData.title;
      document.getElementById("subtitle").textContent = diagramData.subtitle;
      renderLegend();
      renderGroups();
      renderEdges();
      renderNodes();
      renderStages();
      setTransform();
    }

    function renderLegend() {
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      for (const [id, group] of Object.entries(diagramData.groups)) {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="swatch" style="background:${group.color}"></span><span>${group.label}</span>`;
        legend.appendChild(item);
      }
    }

    function renderGroups() {
      groupsLayer.innerHTML = "";
      for (const box of diagramData.groupBoxes || []) {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "group-box");
        rect.setAttribute("x", box.x);
        rect.setAttribute("y", box.y);
        rect.setAttribute("width", box.w);
        rect.setAttribute("height", box.h);
        groupsLayer.appendChild(rect);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "group-title");
        text.setAttribute("x", box.x + 16);
        text.setAttribute("y", box.y + 28);
        text.textContent = box.label;
        groupsLayer.appendChild(text);
      }
    }

    function renderEdges() {
      edgesLayer.innerHTML = "";
      labelsLayer.innerHTML = "";
      for (const edge of diagramData.edges) {
        const a = nodeById[edge.from];
        const b = nodeById[edge.to];
        if (!a || !b) continue;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `edge ${edge.type === "primary" ? "primary" : ""} ${edge.type === "dashed" ? "dashed" : ""}`);
        path.setAttribute("d", edgePath(a, b));
        path.dataset.from = edge.from;
        path.dataset.to = edge.to;
        path.dataset.label = edge.label || "";
        path.addEventListener("mouseenter", evt => showTooltip(evt, edge.label || `${a.label} -> ${b.label}`));
        path.addEventListener("mousemove", moveTooltip);
        path.addEventListener("mouseleave", hideTooltip);
        edgesLayer.appendChild(path);

        const ac = center(a);
        const bc = center(b);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", "edge-label");
        label.setAttribute("x", (ac.x + bc.x) / 2);
        label.setAttribute("y", (ac.y + bc.y) / 2 - 10);
        label.setAttribute("text-anchor", "middle");
        label.textContent = edge.label || "";
        labelsLayer.appendChild(label);
      }
    }

    function renderNodes() {
      nodesLayer.innerHTML = "";
      for (const node of diagramData.nodes) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node");
        g.dataset.id = node.id;
        g.setAttribute("transform", `translate(${node.x} ${node.y})`);
        g.addEventListener("click", () => selectNode(node.id));

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("width", node.w);
        rect.setAttribute("height", node.h);
        rect.setAttribute("stroke", groupColor(node.group));
        g.appendChild(rect);

        const badge = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        badge.setAttribute("class", "badge");
        badge.setAttribute("cx", 18);
        badge.setAttribute("cy", 18);
        badge.setAttribute("r", 13);
        badge.setAttribute("fill", groupColor(node.group));
        g.appendChild(badge);

        const badgeText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        badgeText.setAttribute("class", "badge-text");
        badgeText.setAttribute("x", 18);
        badgeText.setAttribute("y", 18);
        badgeText.textContent = node.step || "";
        g.appendChild(badgeText);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("class", "label");
        label.setAttribute("x", 42);
        label.setAttribute("y", 31);
        label.textContent = node.label;
        g.appendChild(label);

        const kind = document.createElementNS("http://www.w3.org/2000/svg", "text");
        kind.setAttribute("class", "kind");
        kind.setAttribute("x", 42);
        kind.setAttribute("y", 53);
        kind.textContent = node.kind || diagramData.groups[node.group]?.label || node.group;
        g.appendChild(kind);

        nodesLayer.appendChild(g);
      }
    }

    function renderStages() {
      stageList.innerHTML = "";
      for (const [idx, id] of diagramData.steps.entries()) {
        const node = nodeById[id];
        if (!node) continue;
        const item = document.createElement("div");
        item.className = "stage";
        item.dataset.index = idx;
        item.textContent = `${idx + 1}. ${node.label}`;
        item.addEventListener("click", () => setStep(idx));
        stageList.appendChild(item);
      }
    }

    function selectNode(id) {
      selectedNodeId = id;
      const node = nodeById[id];
      document.querySelectorAll(".node").forEach(n => n.classList.toggle("selected", n.dataset.id === id));
      highlightNeighborhood(id);
      const incoming = diagramData.edges.filter(e => e.to === id).map(e => nodeById[e.from]?.label).filter(Boolean);
      const outgoing = diagramData.edges.filter(e => e.from === id).map(e => nodeById[e.to]?.label).filter(Boolean);
      details.innerHTML = `
        <h3>${node.label}</h3>
        <p>${node.detail || "No detail provided."}</p>
        <div class="meta">
          <strong>Type:</strong> ${node.kind || node.group}<br />
          <strong>Group:</strong> ${diagramData.groups[node.group]?.label || node.group}<br />
          <strong>Incoming:</strong> ${incoming.length ? incoming.join(", ") : "none"}<br />
          <strong>Outgoing:</strong> ${outgoing.length ? outgoing.join(", ") : "none"}
        </div>`;
    }

    function highlightNeighborhood(id) {
      const connected = new Set([id]);
      for (const e of diagramData.edges) {
        if (e.from === id) connected.add(e.to);
        if (e.to === id) connected.add(e.from);
      }
      document.querySelectorAll(".node").forEach(n => n.classList.toggle("dimmed", !connected.has(n.dataset.id)));
      document.querySelectorAll(".edge").forEach(e => {
        const isConnected = e.dataset.from === id || e.dataset.to === id;
        e.classList.toggle("highlight", isConnected);
        e.classList.toggle("dimmed", !isConnected);
      });
    }

    function setStep(index) {
      currentStep = Math.max(0, Math.min(index, diagramData.steps.length - 1));
      const id = diagramData.steps[currentStep];
      document.querySelectorAll(".stage").forEach(s => s.classList.toggle("active", Number(s.dataset.index) === currentStep));
      selectNode(id);
    }

    function resetHighlight() {
      selectedNodeId = null;
      currentStep = -1;
      document.querySelectorAll(".node, .edge").forEach(el => el.classList.remove("selected", "dimmed", "highlight"));
      document.querySelectorAll(".stage").forEach(s => s.classList.remove("active"));
      details.innerHTML = `<h3>Select a node</h3><p>Click any diagram node to see what it means, what it connects to, and why it matters.</p>`;
      document.getElementById("search").value = "";
    }

    function fitView() {
      transform = { x: 0, y: 0, scale: 1 };
      setTransform();
    }

    function zoom(factor) {
      transform.scale = Math.max(0.45, Math.min(2.4, transform.scale * factor));
      setTransform();
    }

    function showTooltip(evt, text) {
      tooltip.textContent = text;
      tooltip.classList.add("visible");
      moveTooltip(evt);
    }

    function moveTooltip(evt) {
      const main = document.querySelector("main").getBoundingClientRect();
      tooltip.style.left = `${evt.clientX - main.left}px`;
      tooltip.style.top = `${evt.clientY - main.top}px`;
    }

    function hideTooltip() {
      tooltip.classList.remove("visible");
    }

    document.getElementById("nextStep").addEventListener("click", () => setStep(currentStep + 1));
    document.getElementById("prevStep").addEventListener("click", () => setStep(currentStep <= 0 ? 0 : currentStep - 1));
    document.getElementById("reset").addEventListener("click", resetHighlight);
    document.getElementById("fitView").addEventListener("click", fitView);
    document.getElementById("zoomIn").addEventListener("click", () => zoom(1.14));
    document.getElementById("zoomOut").addEventListener("click", () => zoom(0.88));

    document.getElementById("search").addEventListener("input", evt => {
      const q = evt.target.value.trim().toLowerCase();
      if (!q) {
        document.querySelectorAll(".node").forEach(n => n.classList.remove("dimmed"));
        return;
      }
      let first = null;
      document.querySelectorAll(".node").forEach(el => {
        const node = nodeById[el.dataset.id];
        const hit = [node.label, node.kind, node.detail].join(" ").toLowerCase().includes(q);
        el.classList.toggle("dimmed", !hit);
        if (hit && !first) first = node.id;
      });
      if (first) selectNode(first);
    });

    svg.addEventListener("mousedown", evt => {
      if (evt.target.closest && evt.target.closest(".node")) return;
      dragging = true;
      svg.classList.add("dragging");
      dragStart = { x: evt.clientX - transform.x, y: evt.clientY - transform.y };
    });

    window.addEventListener("mousemove", evt => {
      if (!dragging) return;
      transform.x = evt.clientX - dragStart.x;
      transform.y = evt.clientY - dragStart.y;
      setTransform();
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      svg.classList.remove("dragging");
    });

    svg.addEventListener("wheel", evt => {
      evt.preventDefault();
      zoom(evt.deltaY < 0 ? 1.08 : 0.92);
    }, { passive: false });

    render();
  </script>
</body>
</html>
